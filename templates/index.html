<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Business Pro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent border-bottom border-secondary border-opacity-10 mb-4 py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <div class="rounded-circle bg-primary bg-opacity-25 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                    <i class="bi bi-cpu-fill text-primary fs-5"></i>
                </div>
                <div class="d-flex flex-column">
                    <span class="fw-bold lh-1">Gemini Business</span>
                    <small class="text-muted fw-normal" style="font-size: 0.75rem;">Enterprise Automation</small>
                </div>
            </a>
            <div class="d-flex gap-3">
                <div class="d-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-black bg-opacity-25 border border-secondary border-opacity-10">
                    <span class="spinner-grow spinner-grow-sm text-success" style="--bs-spinner-width: 0.5rem; --bs-spinner-height: 0.5rem;" role="status"></span>
                    <span class="small text-muted font-monospace">SYSTEM ONLINE</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            <!-- Left Sidebar: Profile Management -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center bg-transparent">
                        <span class="d-flex align-items-center gap-2 small text-uppercase text-muted fw-bold"><i class="bi bi-hdd-stack text-primary"></i> 账号配置</span>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-secondary border-opacity-25 rounded-start px-3" onclick="checkAllProfiles()" title="检查所有账号">
                                <i class="bi bi-check-all"></i>
                            </button>
                            <button class="btn btn-sm btn-primary rounded-end px-3" onclick="showAddModal()">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-3">
                        <div class="mb-3">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control bg-transparent border-secondary border-opacity-25 text-light placeholder-opacity-50" 
                                       placeholder="搜索配置..." id="profileSearch">
                            </div>
                        </div>
                        <div id="profileList" class="list-group list-group-flush overflow-auto custom-scroll" style="max-height: 650px;">
                            <!-- Profiles will be loaded here -->
                            <div class="text-center py-5 text-muted opacity-50">
                                <div class="spinner-border spinner-border-sm mb-2" role="status"></div>
                                <p class="small font-monospace">LOADING_DATA...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Content: Tasks & Chat -->
            <div class="col-lg-8">
                <!-- Navigation Tabs -->
                <div class="card mb-4 overflow-hidden">
                    <div class="card-header p-0 border-0">
                        <ul class="nav nav-pills nav-fill p-1 gap-1 bg-black bg-opacity-25" id="mainTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-3 py-2 small text-uppercase fw-bold d-flex align-items-center justify-content-center gap-2" 
                                        id="chat-tab" data-bs-toggle="pill" data-bs-target="#chat-content" type="button">
                                    <i class="bi bi-chat-dots-fill"></i> 对话测试
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-3 py-2 small text-uppercase fw-bold d-flex align-items-center justify-content-center gap-2" 
                                        id="tasks-tab" data-bs-toggle="pill" data-bs-target="#tasks-content" type="button">
                                    <i class="bi bi-cpu-fill"></i> 自动化任务
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="tab-content">
                    <!-- Chat Panel -->
                    <div class="tab-pane fade show active" id="chat-content" role="tabpanel">
                        <div class="card chat-container">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-robot text-primary"></i>
                                    <span class="small fw-bold text-uppercase text-muted">AI Console</span>
                                </div>
                                <div class="d-flex gap-2">
                                    <select class="form-select form-select-sm bg-dark border-secondary border-opacity-25 text-light" id="chatModel" style="width: 160px;">
                                        <!-- Models loaded dynamically -->
                                        <option value="gemini-auto">Gemini Auto</option>
                                    </select>
                                    <button class="btn btn-sm btn-outline-secondary border-opacity-25" onclick="clearChat()" title="清空对话">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="chat-messages custom-scroll" id="chatMessages">
                                <div class="text-center text-muted opacity-25 py-5">
                                    <i class="bi bi-chat-square-quote fs-1 mb-2 d-block"></i>
                                    <p class="small">Ready to connect.</p>
                                </div>
                            </div>
                            <div class="card-footer bg-transparent border-top border-secondary border-opacity-10 p-3">
                                <div class="input-group">
                                    <textarea class="form-control bg-black bg-opacity-25 border-secondary border-opacity-25 text-light custom-scroll" 
                                              id="chatInput" rows="1" placeholder="Type a message..." style="resize: none;"></textarea>
                                    <button class="btn btn-primary px-4" onclick="sendMessage()" id="sendBtn">
                                        <i class="bi bi-send-fill"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tasks Panel -->
                    <div class="tab-pane fade" id="tasks-content" role="tabpanel">
                        <!-- Inner Task Tabs (Segmented Control Style) -->
                        <div class="d-flex mb-3">
                            <div class="bg-black bg-opacity-25 p-1 rounded-3 border border-secondary border-opacity-10">
                                <ul class="nav nav-pills gap-1" id="taskTabs" role="tablist">
                                    <li class="nav-item">
                                        <button class="nav-link active py-1 px-3 small text-light" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-sub-content">
                                            <i class="bi bi-person-plus"></i> 自动注册
                                            <span id="regStatusBadge" class="status-badge status-stopped ms-1" style="font-size: 0.6em;">STOPPED</span>
                                        </button>
                                    </li>
                                    <li class="nav-item">
                                        <button class="nav-link py-1 px-3 small text-light" id="keepalive-tab" data-bs-toggle="pill" data-bs-target="#keepalive-sub-content">
                                            <i class="bi bi-activity"></i> 登录保活
                                            <span id="keepStatusBadge" class="status-badge status-stopped ms-1" style="font-size: 0.6em;">STOPPED</span>
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="tab-content">
                            <!-- Register Task -->
                            <div class="tab-pane fade show active" id="register-sub-content">
                                <div class="card mb-3">
                                    <div class="card-body">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-3">
                                                <label class="form-label small text-muted text-uppercase fw-bold">并发线程</label>
                                                <input type="number" class="form-control bg-dark border-secondary border-opacity-25 text-light" id="regThreads" value="1" min="1" max="10">
                                            </div>
                                            <div class="col-md-9">
                                                <div class="d-flex gap-3 align-items-center mb-2">
                                                    <div class="form-check form-switch">
                                                        <input class="form-check-input" type="checkbox" id="regHeadless" checked>
                                                        <label class="form-check-label small text-muted" for="regHeadless">无头模式 (Headless)</label>
                                                    </div>
                                                    <div class="form-check form-switch">
                                                        <input class="form-check-input" type="checkbox" id="regContinuous">
                                                        <label class="form-check-label small text-muted" for="regContinuous">持续运行</label>
                                                    </div>
                                                </div>
                                                <div class="d-flex gap-2">
                                                    <button class="btn btn-success flex-grow-1" id="btnRegStart" onclick="startRegister()">
                                                        <i class="bi bi-play-fill me-1"></i> 启动任务
                                                    </button>
                                                    <button class="btn btn-danger" id="btnRegStop" onclick="stopRegister()" disabled>
                                                        <i class="bi bi-stop-fill me-1"></i> 停止
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="card-header bg-transparent py-2 small text-muted font-monospace">
                                        <i class="bi bi-terminal me-2"></i>CONSOLE_OUTPUT
                                    </div>
                                    <div id="regLogs" class="terminal-window custom-scroll">
                                        <span class="text-muted opacity-50">> 等待任务启动...</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Keepalive Task -->
                            <div class="tab-pane fade" id="keepalive-sub-content">
                                <div class="card mb-3">
                                    <div class="card-body">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-3">
                                                <label class="form-label small text-muted text-uppercase fw-bold">并发线程</label>
                                                <input type="number" class="form-control bg-dark border-secondary border-opacity-25 text-light" id="keepThreads" value="1" min="1" max="10">
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label small text-muted text-uppercase fw-bold">间隔 (小时)</label>
                                                <input type="number" class="form-control bg-dark border-secondary border-opacity-25 text-light" id="keepInterval" value="1" min="1">
                                            </div>
                                            <div class="col-md-6">
                                                <div class="d-flex gap-2">
                                                    <button class="btn btn-success flex-grow-1" id="btnKeepStart" onclick="startKeepalive()">
                                                        <i class="bi bi-play-fill me-1"></i> 启动保活
                                                    </button>
                                                    <button class="btn btn-danger" id="btnKeepStop" onclick="stopKeepalive()" disabled>
                                                        <i class="bi bi-stop-fill me-1"></i> 停止
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="card-header bg-transparent py-2 small text-muted font-monospace">
                                        <i class="bi bi-terminal me-2"></i>CONSOLE_OUTPUT
                                    </div>
                                    <div id="keepLogs" class="terminal-window custom-scroll">
                                        <span class="text-muted opacity-50">> 等待任务启动...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal (Add/Edit) -->
    <div class="modal fade" id="profileModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border border-secondary border-opacity-25" style="background-color: #1e293b; backdrop-filter: blur(16px);">
                <div class="modal-header border-bottom border-secondary border-opacity-10">
                    <h5 class="modal-title fs-6 text-uppercase fw-bold" id="profileModalTitle">新增配置</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="profileForm" class="needs-validation" novalidate>
                        <input type="hidden" name="id" id="profileId">
                        <div class="mb-3">
                            <label class="form-label small text-muted">名称 (Alias)</label>
                            <input type="text" class="form-control bg-dark border-secondary border-opacity-25 text-light" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Secure C SES</label>
                            <input type="text" class="form-control bg-dark border-secondary border-opacity-25 text-light font-monospace" name="secure_c_ses" required>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted">CSESIDX</label>
                                <input type="text" class="form-control bg-dark border-secondary border-opacity-25 text-light font-monospace" name="csesidx" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">Config ID</label>
                                <input type="text" class="form-control bg-dark border-secondary border-opacity-25 text-light font-monospace" name="config_id" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Host C OSES (Optional)</label>
                            <input type="text" class="form-control bg-dark border-secondary border-opacity-25 text-light font-monospace" name="host_c_oses">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Proxy (Optional)</label>
                            <input type="text" class="form-control bg-dark border-secondary border-opacity-25 text-light font-monospace" name="proxy" placeholder="http://127.0.0.1:7890">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary border-opacity-10">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-sm btn-primary px-4" onclick="submitProfile()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border border-secondary border-opacity-25" style="background-color: #1e293b;">
                <div class="modal-body p-4">
                    <div class="row g-3" id="detailContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-transparent border-0">
                <strong class="me-auto">System Notification</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
